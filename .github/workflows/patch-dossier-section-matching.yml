name: Patch dossier section matching

on:
  push:
    branches:
      - dossier-section-match-fix-20260910
    paths:
      - 'scripts/patch-dossier-section-matching.js'
      - '.github/workflows/patch-dossier-section-matching.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dossier-section-match-fix-20260910
          fetch-depth: 0
      - name: Patch dossier section matching
        run: node scripts/patch-dossier-section-matching.js
      - name: Commit repaired runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dossier-repair.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Find dossier sections inside wrapped production layout"
          git push origin HEAD:dossier-section-match-fix-20260910
