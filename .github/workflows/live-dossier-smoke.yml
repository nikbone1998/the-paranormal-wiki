# Rerun after production section-matching fix fe9778b8
name: Live dossier production smoke test

on:
  push:
    branches:
      - dossier-production-render-fix-20260910
    paths:
      - '.github/workflows/live-dossier-smoke.yml'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dossier-production-render-fix-20260910
          fetch-depth: 0
      - name: Check rendered production dossiers
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium not found on runner" >&2
            exit 1
          fi
          mkdir -p reports /tmp/dossier-smoke
          printf '{\n  "productionUrl": "https://www.theparanormalwiki.com/",\n  "checkedAt": "%s",\n  "browser": "%s",\n  "results": [\n' "$(date -u +%FT%TZ)" "$CHROME" > reports/live-dossier-smoke.json
          slugs=(ghost mothman bigfoot vampire banshee demon draugr chupacabra)
          first=1
          failures=0
          for slug in "${slugs[@]}"; do
            dom="/tmp/dossier-smoke/${slug}.html"
            body="/tmp/dossier-smoke/${slug}-body.html"
            timeout 45s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --virtual-time-budget=7000 --dump-dom "https://www.theparanormalwiki.com/#entity/${slug}" > "$dom"
            python3 - "$dom" "$body" <<'PY'
          import re, sys
          source = open(sys.argv[1], encoding='utf-8').read()
          source = re.sub(r'<script\b[^>]*>.*?</script>', '', source, flags=re.I|re.S)
          source = re.sub(r'<style\b[^>]*>.*?</style>', '', source, flags=re.I|re.S)
          open(sys.argv[2], 'w', encoding='utf-8').write(source)
          PY
            overview=false; grep -q 'id="dossier-overview"' "$body" && overview=true
            nav=false; grep -q 'class="dossier-nav"' "$body" && nav=true
            behavior=false; grep -q 'id="dossier-behavior"' "$body" && behavior=true
            sightings=false; grep -q 'id="dossier-sightings"' "$body" && sightings=true
            weaknesses=false; grep -q 'id="dossier-weaknesses"' "$body" && weaknesses=true
            culture=false; grep -q 'id="dossier-culture"' "$body" && culture=true
            science=false; grep -q 'id="dossier-science"' "$body" && science=true
            controversy=false; grep -q 'id="dossier-controversy"' "$body" && controversy=true
            frequency=false; grep -q 'id="dossier-frequency"' "$body" && grep -q 'dossier-frequency-label' "$body" && frequency=true
            geography=false; grep -q 'id="dossier-geography"' "$body" && grep -q 'data-field-summary' "$body" && geography=true
            legacy=false; grep -q 'NO INVENTED SIGHTING COUNTS' "$body" && legacy=true
            ok=false
            if $overview && $nav && $behavior && $sightings && $weaknesses && $culture && $science && $controversy && $frequency && $geography && ! $legacy; then ok=true; else failures=$((failures+1)); fi
            [ $first -eq 1 ] || printf ',\n' >> reports/live-dossier-smoke.json
            first=0
            printf '    {"slug":"%s","overview":%s,"nav":%s,"behavior":%s,"famousSightings":%s,"weaknesses":%s,"culturalSignificance":%s,"scientificExplanations":%s,"hoaxesAndControversies":%s,"reportFrequency":%s,"geographicalOrigin":%s,"legacyGenericFrequencyVisible":%s,"ok":%s}' "$slug" "$overview" "$nav" "$behavior" "$sightings" "$weaknesses" "$culture" "$science" "$controversy" "$frequency" "$geography" "$legacy" "$ok" >> reports/live-dossier-smoke.json
          done
          printf '\n  ],\n  "failures": %d,\n  "passed": %s\n}\n' "$failures" "$([ "$failures" -eq 0 ] && echo true || echo false)" >> reports/live-dossier-smoke.json
          cat reports/live-dossier-smoke.json
          test "$failures" -eq 0
      - name: Commit smoke report
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/live-dossier-smoke.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record corrected live dossier production smoke test"
          git push origin HEAD:dossier-production-render-fix-20260910
