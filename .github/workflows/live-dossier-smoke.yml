name: Live dossier production smoke test

on:
  push:
    branches:
      - dossier-production-render-fix-20260910
    paths:
      - '.github/workflows/live-dossier-smoke.yml'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dossier-production-render-fix-20260910
          fetch-depth: 0
      - name: Diagnose rendered production dossier
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          mkdir -p reports /tmp/dossier-smoke
          timeout 45s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --virtual-time-budget=7000 --dump-dom "https://www.theparanormalwiki.com/#entity/ghost" > /tmp/dossier-smoke/ghost.html
          python3 - <<'PY'
          import re, html, json, collections
          s=open('/tmp/dossier-smoke/ghost.html', encoding='utf-8').read()
          s=re.sub(r'<script\b[^>]*>.*?</script>', '', s, flags=re.I|re.S)
          s=re.sub(r'<style\b[^>]*>.*?</style>', '', s, flags=re.I|re.S)
          class_counter=collections.Counter()
          for classes in re.findall(r'class="([^"]+)"', s, flags=re.I):
              for c in classes.split(): class_counter[c]+=1
          ids=sorted(set(re.findall(r'id="([^"]+)"', s, flags=re.I)))
          snippets=[]
          keys=['BEHAVIOR','FAMOUS SIGHTINGS','WEAKNESSES','CULTURAL SIGNIFICANCE','SCIENTIFIC','HOAXES','REPORT FREQUENCY','GEOGRAPHICAL ORIGIN','KNOWN HISTORY','PHYSICAL DESCRIPTION']
          upper=s.upper()
          for key in keys:
              pos=upper.find(key)
              if pos>=0:
                  frag=s[max(0,pos-220):pos+360]
                  frag=re.sub(r'\s+',' ',frag).strip()
                  snippets.append({'key':key,'fragment':frag})
          out={
            'overview': 'id="dossier-overview"' in s,
            'nav': 'class="dossier-nav"' in s,
            'coreSections': 'dossier-core-sections' in s,
            'classCounts': class_counter.most_common(80),
            'ids': ids[:160],
            'keywordFragments': snippets,
          }
          open('reports/live-dossier-structure.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - name: Commit diagnostic
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/live-dossier-structure.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record transformed live dossier DOM structure"
          git push origin HEAD:dossier-production-render-fix-20260910
