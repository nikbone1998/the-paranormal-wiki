name: Live dossier production smoke test

on:
  push:
    branches:
      - dossier-production-render-fix-20260910
    paths:
      - '.github/workflows/live-dossier-smoke.yml'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dossier-production-render-fix-20260910
          fetch-depth: 0
      - name: Diagnose rendered production dossier
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          mkdir -p reports /tmp/dossier-smoke
          timeout 45s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --virtual-time-budget=7000 --dump-dom "https://www.theparanormalwiki.com/#entity/ghost" > /tmp/dossier-smoke/ghost.html
          python3 - <<'PY'
          import re, html, json
          s=open('/tmp/dossier-smoke/ghost.html', encoding='utf-8').read()
          s=re.sub(r'<script\b[^>]*>.*?</script>', '', s, flags=re.I|re.S)
          s=re.sub(r'<style\b[^>]*>.*?</style>', '', s, flags=re.I|re.S)
          titles=[]
          for m in re.finditer(r'<(?P<tag>[a-z0-9]+)\b(?P<attrs>[^>]*)class="(?P<class>[^"]*\bbox-title\b[^"]*)"(?P<rest>[^>]*)>(?P<body>.*?)</(?P=tag)>', s, flags=re.I|re.S):
              txt=html.unescape(re.sub(r'<[^>]+>', ' ', m.group('body')))
              txt=re.sub(r'\s+', ' ', txt).strip()
              titles.append({'tag':m.group('tag'),'class':m.group('class'),'text':txt})
          out={
            'overview': 'id="dossier-overview"' in s,
            'nav': 'class="dossier-nav"' in s,
            'tableBoxCount': len(re.findall(r'<table\b[^>]*class="[^"]*\bbox\b', s, flags=re.I)),
            'anyBoxCount': len(re.findall(r'<[a-z0-9]+\b[^>]*class="[^"]*\bbox\b', s, flags=re.I)),
            'boxTitles': titles,
            'dossierIds': sorted(set(re.findall(r'id="(dossier-[^"]+)"', s))),
            'coreSections': 'dossier-core-sections' in s,
            'frequencyLabel': 'dossier-frequency-label' in s,
            'fieldSummary': 'data-field-summary' in s,
          }
          open('reports/live-dossier-structure.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - name: Commit diagnostic
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/live-dossier-structure.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record live dossier DOM structure diagnostic"
          git push origin HEAD:dossier-production-render-fix-20260910
