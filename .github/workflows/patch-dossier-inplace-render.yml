name: Patch dossier in-place render

on:
  push:
    branches:
      - dossier-inplace-render-fix-20260910
    paths:
      - 'scripts/patch-dossier-inplace-render.js'
      - '.github/workflows/patch-dossier-inplace-render.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dossier-inplace-render-fix-20260910
          fetch-depth: 0
      - name: Remove destructive dossier section reparenting
        run: node scripts/patch-dossier-inplace-render.js
      - name: Commit repaired runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dossier-repair.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Render canonical dossier fields in place"
          git push origin HEAD:dossier-inplace-render-fix-20260910
