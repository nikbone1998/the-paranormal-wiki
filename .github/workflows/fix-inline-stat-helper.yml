name: Fix inline dossier stat helper

on:
  push:
    branches:
      - dossier-base-renderer-fix-20260910
    paths:
      - '.github/workflows/fix-inline-stat-helper.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dossier-base-renderer-fix-20260910
          fetch-depth: 0
      - name: Define stat before initial route
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'const stat=bar;' not in s:
              i=s.index('const bar=n=>')
              j=s.find('\n',i)
              if j<0: raise SystemExit('bar line terminator not found')
              s=s[:j]+'\nconst stat=bar;'+s[j:]
              p.write_text(s,encoding='utf-8')
          print('stat helper is available before route()')
          PY
      - name: Commit stat helper repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Define dossier stat helper before initial route"
          git push origin HEAD:dossier-base-renderer-fix-20260910
